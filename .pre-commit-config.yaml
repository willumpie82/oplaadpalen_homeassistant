repos:
  # YAML validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Python code style
  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]

  # Python linting
  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --ignore=E501,W503,E203]

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.0.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-all]
        files: ^(oplaadpalen_py|custom_components)

  # Unit tests (custom hook)
  - repo: local
    hooks:
      - id: pytest-check
        name: pytest
        entry: bash -c 'cd oplaadpalen_py && python3 -m pytest test_client.py -v --tb=short'
        language: system
        types: [python]
        pass_filenames: false
        stages: [commit]
        always_run: true
